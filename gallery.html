<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEA Dent Gallery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<style>
.gallery-hero{
  padding:140px 20px 70px;
  text-align:center;
  background:var(--soft);
}

.gallery-hero h1{
  font-family:"Fraunces",serif;
  font-size:clamp(2.5rem,5vw,4rem);
  margin-bottom:15px;
}

.gallery-hero p{
  max-width:700px;
  margin:auto;
  color:var(--muted);
}

.gallery-grid{
  width:min(1400px,92%);
  margin:60px auto 100px;
  columns:4 300px;
  column-gap:20px;
}

.gallery-item{
  margin-bottom:20px;
  break-inside:avoid;
}

.gallery-item img{
  width:100%;
  border-radius:18px;
  display:block;
  box-shadow:var(--shadow);
  transition:.35s;
}

.gallery-item img:hover{
  transform:translateY(-6px);
  box-shadow:var(--shadow-hover);
}

.back-home{
  display:inline-flex;
  margin-top:30px;
}
  .gallery-item video{
  width:100%;
  display:block;
  border-radius:18px;
  box-shadow:var(--shadow);
  background:#000;
  transition:.35s;
}

.gallery-item:hover video{
  transform:translateY(-6px);
  box-shadow:var(--shadow-hover);
}

.gallery-filters{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  margin:0 auto 40px;
  width:min(1400px,92%);
}

.filter-btn{
  border:none;
  padding:12px 24px;
  border-radius:999px;
  background:#f3f4f6;
  cursor:pointer;
  font-weight:600;
  transition:.3s;
}

.filter-btn:hover,
.filter-btn.active{
  background:#b78a56;
  color:#fff;
}
</style>
</head>

<body>

<header class="header">
  <div class="container header__inner">

    <a href="index.html" class="brand">
      <img src="deanav.png" alt="DEA Dent Logo" class="brand__logo">
    </a>

    <div class="lang">
      <button class="lang__btn is-active" data-lang="sq">SQ</button>
      <button class="lang__btn" data-lang="mk">MK</button>
      <button class="lang__btn" data-lang="tr">TR</button>
    </div>

  </div>
</header>

<section class="gallery-hero">

  <h1 data-i18n="gallerypage.title">
    DEA Dent Gallery
  </h1>

  <p data-i18n="gallerypage.subtitle">
    A collection of photographs from our modern clinic.
  </p>

  <a href="index.html" class="btn btn--primary back-home">
    ← Home
  </a>

</section>

<section>

<!-- FILTER BUTTONS -->
<div class="gallery-filters">
  <button class="filter-btn active" data-filter="all">Të Gjitha</button>
  <button class="filter-btn" data-filter="ortodonci">Ortodonci</button>
  <button class="filter-btn" data-filter="protetik">Protetikë</button>
  <button class="filter-btn" data-filter="implantologji">Implantologji</button>
  <button class="filter-btn" data-filter="endodonci">Endodonci</button>
</div>

<!-- GALLERY -->
<div class="gallery-grid">

  <!-- ORTODONCI -->
  <div class="gallery-item ortodonci">
    <img src="https://i.imgur.com/rQV6n4t.jpeg" alt="Ortodonci">
  </div>

  <div class="gallery-item ortodonci">
    <video controls preload="metadata" playsinline>
      <source src="video1.mp4" type="video/mp4">
    </video>
  </div>

  <div class="gallery-item ortodonci">
    <img src="https://i.imgur.com/STuyWwk.jpeg" alt="Ortodonci">
  </div>

  <div class="gallery-item ortodonci">
    <img src="https://i.imgur.com/CuFafmp.jpeg" alt="Ortodonci">
  </div>


  <!-- PROTETIK -->
  <div class="gallery-item protetik">
    <img src="https://i.imgur.com/7d9X7YG.jpeg" alt="Protetik">
  </div>

  <div class="gallery-item protetik">
    <img src="https://i.imgur.com/o8MZr1F.jpeg" alt="Protetik">
  </div>

  <div class="gallery-item protetik">
    <img src="https://i.imgur.com/PophjnO.jpeg" alt="Protetik">
  </div>

  <div class="gallery-item protetik">
    <img src="https://i.imgur.com/lcP5q7a.jpeg" alt="Protetik">
  </div>


  <!-- IMPLANTOLOGJI -->
  <div class="gallery-item implantologji">
    <img src="https://i.imgur.com/rOFCN62.jpeg" alt="Implantologji">
  </div>

  <div class="gallery-item implantologji">
    <img src="https://i.imgur.com/Xpe6WG9.jpeg" alt="Implantologji">
  </div>

  <div class="gallery-item implantologji">
    <video controls preload="metadata" playsinline>
      <source src="video3.mp4" type="video/mp4">
    </video>
  </div>

  <div class="gallery-item implantologji">
    <img src="https://i.imgur.com/4NEYXn5.jpeg" alt="Implantologji">
  </div>

  <div class="gallery-item implantologji">

  <!-- ENDODONCI -->
  <div class="gallery-item endodonci">
    <img src="https://i.imgur.com/dtA7Ccs.jpeg" alt="Endodonci">
  </div>

  <div class="gallery-item endodonci">
    <img src="https://i.imgur.com/Y7gAcJJ.jpeg" alt="Endodonci">
  </div>

  <div class="gallery-item endodonci">
    <img src="https://i.imgur.com/IXWmdCf.jpeg" alt="Endodonci">
  </div>

  <div class="gallery-item endodonci">
    <video controls preload="metadata" playsinline>
      <source src="video2.mp4" type="video/mp4">
    </video>
  </div>

  <div class="gallery-item endodonci">
    <img src="https://i.imgur.com/fA2Okga.jpeg" alt="Endodonci">
  </div>

  <div class="gallery-item endodonci">
    <img src="https://i.imgur.com/Dwspfie.jpeg" alt="Endodonci">

  <div class="gallery-item endodonci">
    <img src="https://i.imgur.com/oyMs38c.jpeg" alt="Endodonci">
  </div>

</div>

</section>

<script src="script.js"></script>
<script>
const filterButtons = document.querySelectorAll(".filter-btn");
const galleryItems = document.querySelectorAll(".gallery-item");

filterButtons.forEach(button => {

  button.addEventListener("click", () => {

    filterButtons.forEach(btn =>
      btn.classList.remove("active")
    );

    button.classList.add("active");

    const filter = button.dataset.filter;

    galleryItems.forEach(item => {

      if(filter === "all"){
        item.style.display = "block";
      } else {
        item.style.display =
          item.classList.contains(filter)
            ? "block"
            : "none";
      }

    });

  });

});
</script>
</body>
</html>
